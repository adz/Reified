name: Pages

on:
  push:
    branches: [ main ]
    paths:
      - .config/**
      - .github/workflows/pages.yml
      - .livedocs/**
      - docs/**
      - src/**
      - Directory.Build.props
      - Reified.slnx
  workflow_dispatch:
    inputs:
      version:
        description: Released semantic version to add to this history build
        required: false
        type: string
      capsule_url:
        description: HTTPS URL of the released documentation capsule
        required: false
        type: string
      capsule_sha256:
        description: SHA-256 of the released documentation capsule
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build Reified.slnx --configuration Release --no-restore --nologo -v minimal

      - name: Synchronize release capsules into this history build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS=$'\t' read -r version capsule_url capsule_sha256; do
            existing="$(jq -r --arg version "$version" '.Entries[] | select(.Version == $version) | [.CapsuleUrl, .CapsuleSha256] | @tsv' .livedocs/history.json)"

            if [[ -z "$existing" ]]; then
              dotnet livedocs history-add "$version" \
                --url "$capsule_url" \
                --sha256 "$capsule_sha256" \
                --interactive false \
                --banner false
            elif [[ "$existing" != "$capsule_url"$'\t'"$capsule_sha256" ]]; then
              echo "History already contains $version with a different capsule URL or checksum." >&2
              exit 1
            else
              echo "History already contains the verified $version capsule."
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -r '
              [ .[]
                | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                | (.tag_name | ltrimstr("v")) as $version
                | .assets[]
                | select(.name == ("Reified-" + $version + "-livedocs.zip"))
                | select(.digest | startswith("sha256:"))
                | { version: $version, url: .browser_download_url, sha256: (.digest | ltrimstr("sha256:")) }
              ]
              | sort_by(.version | split(".") | map(tonumber))[]
              | [.version, .url, .sha256]
              | @tsv'
          )

          if [[ -n "${{ inputs.version }}" ]]; then
            expected="${{ inputs.capsule_url }}"$'\t'"${{ inputs.capsule_sha256 }}"
            actual="$(jq -r --arg version "${{ inputs.version }}" '.Entries[] | select(.Version == $version) | [.CapsuleUrl, .CapsuleSha256] | @tsv' .livedocs/history.json)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Dispatched release ${{ inputs.version }} was not found with the expected capsule." >&2
              exit 1
            fi
          fi

      - name: Build versioned docs site
        run: dotnet livedocs build-history .livedocs/history.json --interactive false --banner false

      - name: Prepare Pages artifact
        run: touch output/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
