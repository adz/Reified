name: Pages

on:
  push:
    branches: [ main ]
    paths:
      - .config/**
      - .github/workflows/pages.yml
      - .livedocs/**
      - docs/**
      - src/**
      - Directory.Build.props
      - Reified.slnx
  workflow_dispatch:
    inputs:
      version:
        description: Released semantic version to add to this history build
        required: false
        type: string
      capsule_url:
        description: HTTPS URL of the released documentation capsule
        required: false
        type: string
      capsule_sha256:
        description: SHA-256 of the released documentation capsule
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore LiveDocs processing cache
        uses: actions/cache@v4
        with:
          path: .livedocs/cache
          key: livedocs-${{ runner.os }}-${{ hashFiles('.config/dotnet-tools.json', '.livedocs/history.json') }}
          restore-keys: |
            livedocs-${{ runner.os }}-

      - name: Synchronize capsules, build history, and verify Pages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CAPSULE_URL: ${{ inputs.capsule_url }}
          RELEASE_CAPSULE_SHA256: ${{ inputs.capsule_sha256 }}
        run: dotnet run --project tools/Reified.Build -- --target Pages

      - name: Prepare Pages artifact
        run: touch output/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
