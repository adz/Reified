name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build Reified.slnx --configuration Release --no-restore --nologo -v minimal

      - name: Test
        run: dotnet test Reified.slnx --configuration Release --no-build --nologo -v minimal

      - name: Check Schema CE compiler errors
        run: bash scripts/check-schema-ce-errors.sh

      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "package_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "package_version=0.0.0-rcDev" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/check-release-notes.sh "${{ steps.version.outputs.package_version }}"

      - name: Report runner resources
        run: |
          nproc
          free -h

      - name: Audit documentation
        run: dotnet livedocs audit --warn-as-error --verbosity debug --interactive false

      - name: Build docs site
        run: dotnet livedocs build --version "${{ steps.version.outputs.package_version }}"

      - name: Capture release capsule
        run: dotnet livedocs capture --version "${{ steps.version.outputs.package_version }}" --output "artifacts/Reified-${{ steps.version.outputs.package_version }}-livedocs.zip"

      - name: Pack libraries
        run: bash scripts/pack.sh -v "${{ steps.version.outputs.package_version }}"

      - name: Archive package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/package/
          if-no-files-found: error

      - name: Archive generated docs
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: output/
          if-no-files-found: error

      - name: Archive release capsule
        uses: actions/upload-artifact@v4
        with:
          name: livedocs-capsule
          path: artifacts/*-livedocs.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: "dev-docs/releases/${{ steps.version.outputs.package_version }}.md"
          files: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg

  publish-nuget:
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/package

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/package/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Publish NuGet symbol packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/package/*.snupkg; do
            [ -e "$package" ] || continue
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
