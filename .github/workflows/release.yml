name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and repair
        required: false
        type: string

permissions:
  actions: write
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            [[ "${{ inputs.release_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            echo "package_version=${{ inputs.release_tag }}" | sed 's/package_version=v/package_version=/' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "package_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "package_version=0.0.0-rcDev" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify complete release candidate
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REIFIED_VERSION: ${{ steps.version.outputs.package_version }}
        run: dotnet run --project tools/Reified.Build -- --target ReleaseCandidate

      - name: Verify development release pipeline
        if: inputs.release_tag == '' && !startsWith(github.ref, 'refs/tags/v')
        env:
          REIFIED_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          dotnet run --project tools/Reified.Build -- --target Verify
          dotnet run --project tools/Reified.Build -- --target DocsCapture

      - name: Archive package artifacts
        if: inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: livedocs-capsule
          path: artifacts/*-livedocs.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dev-docs/releases/${{ steps.version.outputs.package_version }}.md
          files: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg
            artifacts/Reified-${{ steps.version.outputs.package_version }}-livedocs.zip

      - name: Repair documentation asset on an existing GitHub Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" "artifacts/Reified-${{ steps.version.outputs.package_version }}-livedocs.zip" --clobber

      - name: Publish and await release documentation
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.package_version }}"
          capsule="artifacts/Reified-$version-livedocs.zip"
          tag="${{ inputs.release_tag || github.ref_name }}"
          before="$(gh run list --workflow pages.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}" \
            -f version="$version" \
            -f capsule_url="https://github.com/${{ github.repository }}/releases/download/$tag/Reified-$version-livedocs.zip" \
            -f capsule_sha256="$(sha256sum "$capsule" | cut -d ' ' -f 1)"
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow pages.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            [[ "$run_id" != "$before" ]] && break
            sleep 2
          done
          [[ "$run_id" != "$before" ]] || { echo "Pages dispatch was not observed." >&2; exit 1; }
          gh run watch "$run_id" --exit-status

  publish-nuget:
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/package
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          for package in artifacts/package/*.nupkg artifacts/package/*.snupkg; do
            [ -e "$package" ] || continue
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
