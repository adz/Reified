# Sidebar for the Notes area. Notes is not a product area — it holds the meta pages
# (inventory, platforms, measurements, design rationale) that were competing with the
# learning path inside /schema/. It lists its own pages, then routes back to the areas.
groups:
  - title: Notes
    home: /notes
    kind: primary
    caption: Package inventory, platform support, measured numbers, and the compiler-directed design.
    entries:
      - /notes/packages-and-platforms
      - /notes/benchmarks
      - /notes/aot-trimming-fable

  - title: Getting started
    home: /getting-started
    caption: One complete transaction, from untrusted input to a typed model and a derived JSON codec.
    descendants: false

  - title: Values
    home: /values
    caption: Constraint, Refinements, and Parse — rules about a value, and types that carry them.
    descendants: false

  - title: Reified.Schema
    home: /schema
    caption: Declare how structured input becomes a model, then derive codecs, contracts, and fixtures.
    descendants: false

  - title: Reified.Data
    home: /data
    caption: Portable structured values for documents, fixtures, boundaries, and adapters.
    descendants: false

  - title: Reified.Result
    home: /result
    caption: Composition over the standard F# Result type.
    descendants: false
