groups:
  - title: Reified.Result
    home: /result
    kind: primary
    caption: Compose operations that can fail, using the standard F# Result type. Installs on its own.
    children_of:
      - /result
    # Every path the Reference block renders must also be excluded from the main list, or the whole
    # reference subtree is emitted twice and its sidebar element ids collide. Result nests one level
    # deeper than the other packages (reference/result/{result,result-ce}), so both levels are listed.
    exclude:
      - /result/reference
      - /result/reference/result
    reference:
      children_of:
        - /result/reference/result
