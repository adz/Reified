groups:
  - title: Values
    home: /values
    kind: primary
    caption: Constraint, Refined, and Parse. A grouping, not a package — each installs independently.
    descendants: false
    entries:
      - /values/quickstart
      - /values/reference-app

  - title: Reified.Constraint
    home: /values/constraint
    caption: One reusable description of valid values, shared by every interpreter.
    children_of:
      - /values/constraint
    entries:
      - /values/tutorials
    reference:
      children_of:
        - /values/reference/constraint

  - title: Reified.Refinements
    home: /values/refined
    caption: Construct values whose types record successful checks.
    children_of:
      - /values/refined
    reference:
      children_of:
        - /values/reference/refined

  - title: Reified.Parse
    home: /values/parse
    caption: Named parsers for serialized primitive values.
    descendants: false
    reference:
      children_of:
        - /values/reference/parse
